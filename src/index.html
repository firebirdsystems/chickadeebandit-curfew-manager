<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curfew Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: #f3f4f6;
      --green:        var(--hub-tint-success-fg, #16a34a); --green-light: var(--hub-tint-success, #dcfce7);
      --amber:        var(--hub-tint-warning-fg, #d97706); --amber-light: var(--hub-tint-warning, #fef3c7);
      --red:          var(--hub-tint-danger-fg, #dc2626); --red-light: var(--hub-tint-danger, #fee2e2);
      --indigo:       #4f46e5; --indigo-ink: var(--hub-tint-info-fg, #4f46e5); --indigo-light: var(--hub-tint-info, #eef2ff);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* ── Header ───────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: var(--accent);
      border-radius: var(--radius);
      color: var(--accent-fg);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 2px; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-header {
      background: rgba(255,255,255,.15);
      color: white;
      border: 1.5px solid rgba(255,255,255,.3);
    }
    .btn-header:hover:not(:disabled) { background: rgba(255,255,255,.25); }

    /* ── Tabs ─────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .tab-badge {
      background: var(--amber);
      color: white;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }

    /* ── Cards ────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .request-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: border-color .15s;
    }
    .request-card:hover { border-color: var(--accent); }
    .request-card.needs-action { border-color: var(--amber); background: var(--hub-tint-warning, #fffbeb); }
    .request-main { flex: 1; min-width: 0; }
    .request-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .request-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
    .request-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .action-needed { font-size: 0.72rem; font-weight: 600; color: var(--amber); }

    /* ── Status badges ────────────────────────────────────── */
    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .status-pending  { background: var(--amber-light);  color: var(--amber); }
    .status-approved { background: var(--green-light);  color: var(--green); }
    .status-denied   { background: var(--red-light);    color: var(--red); }

    /* ── Schedule cards ───────────────────────────────────── */
    .child-schedule-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .child-schedule-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .child-schedule-header .name { font-weight: 600; font-size: 1rem; flex: 1; }
    .schedule-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .schedule-row:last-child { border-bottom: none; }
    .schedule-label { font-size: 0.9rem; font-weight: 500; }
    .schedule-time  { font-size: 0.9rem; color: var(--muted); }
    .schedule-time.set { color: var(--text); font-weight: 600; }

    /* ── Avatar ───────────────────────────────────────────── */
    .avatar {
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .avatar.md { width: 36px; height: 36px; font-size: 1rem; }
    .avatar.sm { width: 26px; height: 26px; font-size: 0.75rem; }
    .avatar.xs { width: 20px; height: 20px; font-size: 0.65rem; }

    /* ── Curfew summary banner (child view) ───────────────── */
    .curfew-banner {
      background: var(--indigo-light);
      border: 1px solid var(--indigo);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .curfew-banner .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--indigo-ink);
      margin-bottom: 8px;
    }
    .curfew-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .curfew-slot { }
    .curfew-slot .day  { font-size: 0.78rem; color: var(--muted); margin-bottom: 2px; }
    .curfew-slot .time { font-size: 1.2rem; font-weight: 700; color: var(--indigo-ink); }
    .curfew-slot .none { font-size: 0.9rem; color: var(--muted); font-style: italic; }

    /* ── Modal ────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    @media (min-width: 480px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      max-height: 92vh;
      overflow-y: auto;
    }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }

    /* ── Form ─────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      background: var(--card);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 72px; }
    .form-group .row { display: flex; gap: 10px; }
    .form-group .row > * { flex: 1; }
    .form-hint { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .form-notice {
      background: var(--amber-light);
      color: var(--amber);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    /* ── Modal actions ────────────────────────────────────── */
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 100px; }

    /* ── Detail fields ────────────────────────────────────── */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .detail-value { font-size: 0.92rem; font-weight: 500; }
    .detail-member { display: flex; align-items: center; gap: 6px; }

    .review-box {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 4px;
    }
    .review-box.approved { background: var(--green-light); color: var(--hub-tint-success-fg, #14532d); }
    .review-box.denied   { background: var(--red-light);   color: var(--hub-tint-danger-fg, #7f1d1d); }
    .review-box .by { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    /* ── Misc ─────────────────────────────────────────────── */
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .app-error { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--red-light); color: var(--red); font-size: 0.88rem; }
    .scope-note { margin: 0 0 14px; color: var(--muted); font-size: 0.85rem; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
  <base href="/run/curfew-manager/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm, hubAlert, searchMatch, hubToday, glyph } from "/hub-sdk.js";
import { formatTime, formatDate, getDayType, getCurfewForDate, exceedsCurfew, STATUS_INFO, searchableFields, reviewsRequests, hasNoChildren, outcomeUnknown, storedDiffers, SAVED_AS_FIRST, failureLine } from "./logic.js";

const CONTEXT    = window.__CONTEXT_URL    ?? "";
const DB         = window.__DB_URL         ?? "";
const APP_ID     = window.__APP_ID         ?? "curfew-manager";
const ME         = window.__CURRENT_MEMBER ?? null;
const EVENTS_URL = window.__EVENTS_URL     ?? "/api/events";
// Reviewing other members' requests: any adult in a household, and only the
// steward in a shared space. The hub decides; this only keeps the page from
// offering a review it would refuse.
const REVIEWS = reviewsRequests(ME, { tenantKind: window.__TENANT_KIND ?? "household", isAdmin: window.__IS_ADMIN === true });

// ─── State ────────────────────────────────────────────────────────────────────
let members   = [];
let memberMap = new Map();
let curfews   = [];
let requests  = [];
let activeTab = "requests"; // adult: "requests" | "schedule" | child: irrelevant
let searchQ = "";       // in-app search (see logic.js searchableFields)
let detailReqId   = null;   // request open in the detail modal
let decisionReqId = null;   // request open in the approve/deny modal

// Request ids come from the DB and are attacker-controllable via raw /api/db (a
// child can INSERT an exception request with a crafted id), so cards carry the id
// in a data-* attribute read back with getAttribute — never interpolated into an
// inline onclick JS string, which the approving parent's browser would execute.
document.getElementById("root").addEventListener("click", (e) => {
  const card = e.target.closest("[data-detail-id]");
  if (card) window.openDetail_(card.getAttribute("data-detail-id"));
});

// ─── DB helper ────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  // A refusal is an answer too: without this a write the hub turned down read
  // as a success, and the page went on to show a change that was never made.
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "That could not be saved"), { status: res.status, code: json?.code });
  return json;
}

// ─── Load ──────────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",   role: "adult" },
      { id: "demo-2", name: "Sam",    role: "adult" },
      { id: "demo-3", name: "Jordan", role: "child" },
      { id: "demo-4", name: "Casey",  role: "child" },
    ];
    memberMap = new Map(members.map(m => [m.id, m]));
    return;
  }
  // A failed read throws: it is a failed load, never a household of nobody.
  const res = await fetch(`${CONTEXT}?keys=family.members`);
  const data = await res.json().catch(() => null);
  if (!res.ok || data === null || typeof data !== "object" || Array.isArray(data)) throw new Error("Couldn’t reach the hub. Try again.");
  // A 200 can still name a key the hub failed to read.
  if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
  members = data["family.members"] ?? [];
  memberMap = new Map(members.map(m => [m.id, m]));
}

async function loadCurfews() {
  if (!DB) {
    curfews = [
      { member_id: "demo-3", day_type: "weekday", curfew_time: "21:00" },
      { member_id: "demo-3", day_type: "weekend", curfew_time: "22:30" },
      { member_id: "demo-4", day_type: "weekday", curfew_time: "20:30" },
    ];
    return;
  }
  const { rows } = await db(`SELECT member_id, day_type, curfew_time FROM app_curfew_manager__curfews`);
  curfews = rows ?? [];
}

async function loadRequests() {
  if (!DB || !ME) return;
  // An adult who takes part in a shared space without stewarding it asks for
  // no exceptions and may read nobody else's, so there is nothing to load.
  if (isAdult(ME) && !REVIEWS) return;
  let rows;
  if (REVIEWS) {
    ({ rows } = await db(`
      SELECT * FROM app_curfew_manager__exception_requests
      WHERE status != 'denied' OR date >= date('now', '-30 days')
      ORDER BY
        CASE status WHEN 'pending' THEN 0 WHEN 'approved' THEN 1 ELSE 2 END,
        date ASC, requested_time ASC
    `));
  } else {
    ({ rows } = await db(`
      SELECT * FROM app_curfew_manager__exception_requests
      WHERE member_id = ?
      ORDER BY
        CASE status WHEN 'pending' THEN 0 WHEN 'approved' THEN 1 ELSE 2 END,
        date ASC
    `, [ME.id]));
  }
  requests = rows ?? [];
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function mc(id)         { return memberColor(id, members); }
function memberName(id) { return memberMap.get(id)?.name ?? "Unknown"; }
function kids()         { return members.filter(m => !isAdult(m)); }

function statusHtml(status) {
  const { cls, label } = STATUS_INFO[status] ?? STATUS_INFO.pending;
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function curfewFor(memberId, dayType) {
  return curfews.find(c => c.member_id === memberId && c.day_type === dayType)?.curfew_time ?? null;
}

// ─── Notifications ─────────────────────────────────────────────────────────────
async function notify(title, body, audience = null) {
  const payload = { title, body, url: `/run/${APP_ID}` };
  if (audience) payload.audience = audience;
  await fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).catch(() => {});
}

async function publishEvent(type, subjectId, payload = {}) {
  await fetch(EVENTS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      source_app_id: APP_ID,
      type,
      subject_id: subjectId,
      payload,
    }),
  }).catch(() => {});
}

// ─── Actions ──────────────────────────────────────────────────────────────────
// The re-read after a curfew write that changed nothing: the stored row, or
// null. A failed read throws with `found: null`, so the line is "try again".
async function curfewUnchanged(memberId, dayType) {
  try {
    return (await db(`SELECT curfew_time FROM app_curfew_manager__curfews WHERE member_id = ? AND day_type = ?`, [memberId, dayType])).rows?.[0] ?? null;
  } catch (readErr) {
    console.error(readErr);
    throw Object.assign(new Error("curfew unchanged"), { found: null });
  }
}

async function saveCurfew(memberId, dayType, curfewTime) {
  const now = new Date().toISOString();
  if (curfewTime) {
    // `day_type` MUST stay in manifest.db_plaintext_columns. App-db encryption
    // uses a fresh random IV per write, so an encrypted day_type never compares
    // equal to itself: the PRIMARY KEY could not collide, this ON CONFLICT
    // never fired, and every save inserted a SECOND row instead of updating.
    // The list below then read the older row back and the change appeared to
    // revert on reload. Same reason the DELETE and the agenda both match on it.
    const res = await db(`
      INSERT INTO app_curfew_manager__curfews (member_id, day_type, curfew_time, updated_at)
      VALUES (?, ?, ?, ?)
      ON CONFLICT (member_id, day_type)
      DO UPDATE SET curfew_time = excluded.curfew_time, updated_at = excluded.updated_at
    `, [memberId, dayType, curfewTime, now]);
    // 200 with nothing changed: the row policy refused it, unless the stored
    // curfew already says the same.
    if (Number(res?.changed ?? 1) === 0) {
      const row = await curfewUnchanged(memberId, dayType);
      if (row?.curfew_time !== curfewTime) throw Object.assign(new Error("curfew unchanged"), { found: true });
    }
    const idx = curfews.findIndex(c => c.member_id === memberId && c.day_type === dayType);
    if (idx >= 0) curfews[idx] = { member_id: memberId, day_type: dayType, curfew_time: curfewTime };
    else curfews.push({ member_id: memberId, day_type: dayType, curfew_time: curfewTime });
  } else {
    const res = await db(`DELETE FROM app_curfew_manager__curfews WHERE member_id = ? AND day_type = ?`, [memberId, dayType]);
    // Nothing deleted: fine when there was no curfew; one still there was refused.
    if (Number(res?.changed ?? 1) === 0 && await curfewUnchanged(memberId, dayType)) {
      throw Object.assign(new Error("curfew unchanged"), { found: true });
    }
    curfews = curfews.filter(c => !(c.member_id === memberId && c.day_type === dayType));
  }
}

async function submitExceptionRequest(fields, pinHost = null) {
  // The id is the form's, minted on its first Submit and sent on every retry:
  // a try whose answer was lost may have stored the request, and a second
  // press must find it rather than ask (and notify the adults) twice.
  const id  = pinHost ? (pinHost.dataset.rowId ||= crypto.randomUUID()) : crypto.randomUUID();
  let now = new Date().toISOString();
  let note = "";
  try {
    await db(`
      INSERT INTO app_curfew_manager__exception_requests
        (id, member_id, date, requested_time, reason, status, created_at)
      VALUES (?, ?, ?, ?, ?, 'pending', ?)
    `, [id, ME.id, fields.date, fields.requested_time, fields.reason ?? "", now]);
  } catch (e) {
    // Unknown outcome: read the request back by the pinned id. Found means an
    // earlier try landed and its success path never ran, so it runs now, once.
    // Not found, or the read failed: the submit fails, the id stays pinned.
    if (!outcomeUnknown(e)) throw e;
    let stored = null;
    try {
      stored = (await db(`SELECT date, requested_time, reason, created_at FROM app_curfew_manager__exception_requests WHERE id = ?`, [id])).rows?.[0] ?? null;
    } catch (readErr) {
      // The id is ours: with the read-back failed, a UNIQUE answer may be this
      // form's own first try, so nothing is known — "try again", not "already exists".
      console.error(readErr);
      throw new Error("request outcome unknown", { cause: e });
    }
    if (!stored) throw e;
    console.error(e);
    // Edited since that first try: what was stored is kept, and said so.
    if (storedDiffers(stored, { date: fields.date, requested_time: fields.requested_time, reason: fields.reason ?? "" })) note = SAVED_AS_FIRST;
    fields = { date: stored.date, requested_time: stored.requested_time, reason: stored.reason ?? "" };
    now = stored.created_at || now;
  }
  if (pinHost) delete pinHost.dataset.rowId;

  requests = [{
    id, member_id: ME.id, date: fields.date, requested_time: fields.requested_time,
    reason: fields.reason ?? "", status: "pending",
    reviewed_by: null, reviewed_at: null, review_note: null, created_at: now,
  }, ...requests.filter(r => r.id !== id)];
  closeModal();
  render();
  if (note) hubAlert(note);

  const dateLabel = formatDate(fields.date);
  const timeLabel = formatTime(fields.requested_time);
  Promise.all([
    notify(
      `🌙 ${ME.name} is requesting a curfew exception`,
      `${dateLabel} until ${timeLabel}${fields.reason ? ` — ${fields.reason}` : ""} — open Curfew Manager to review`,
      "adults",
    ),
    // No activity-feed write here or at the two sibling sites below. That POST
    // used "message_posted", which is not one of the hub's own ActivityType
    // values a caller may write (CALLER_ALLOWED_ACTIVITY_TYPES) — the near
    // neighbour, conversation_message_posted, means a Household message and is
    // wired to the bell's Messages section, which a curfew request is not. So
    // the hub refused every call with a 403 and no household ever saw an entry;
    // a fetch does not reject on 4xx, so the .catch() hid it. It also sent an
    // `actor` the hub ignores, resolving that from the session instead.
    // The curfew.* events published alongside are the sink that works.
    publishEvent("curfew.exception_requested", id, {
      member_id:      ME.id,
      member_name:    ME.name,
      date:           fields.date,
      requested_time: fields.requested_time,
    }),
  ]).catch(() => {});
}

// A decision that changed nothing: re-read the request, and word the line by
// what is there (a plain `WHERE id = ?`, so a row still present was refused).
async function unchangedRequest(reqId, words) {
  let found = null;
  try {
    found = ((await db(`SELECT id FROM app_curfew_manager__exception_requests WHERE id = ?`, [reqId])).rows?.length ?? 0) > 0;
  } catch (readErr) { console.error(readErr); }
  return Object.assign(new Error(failureLine(null, { ...words, found })), { forUser: true });
}
function decisionWords(decision) {
  return { action: decision === "approve" ? "approve the request" : "deny the request", thing: "request" };
}

async function approveRequest(reqId, note) {
  const req = requests.find(r => r.id === reqId);
  if (!req || req.status !== "pending") return;
  const now = new Date().toISOString();
  const { changed } = await db(`
    UPDATE app_curfew_manager__exception_requests
    SET status = 'approved', reviewed_by = ?, reviewed_at = ?, review_note = ?
    WHERE id = ?
  `, [ME.id, now, note ?? "", reqId]);
  if (changed === 0) throw await unchangedRequest(reqId, decisionWords("approve"));

  const idx = requests.findIndex(r => r.id === reqId);
  if (idx !== -1) requests[idx] = { ...requests[idx], status: "approved", reviewed_by: ME.id, reviewed_at: now, review_note: note ?? "" };
  closeModal();
  render();

  const dateLabel = formatDate(req.date);
  const timeLabel = formatTime(req.requested_time);
  const childName = memberName(req.member_id);
  Promise.all([
    notify(
      `✅ Curfew exception approved`,
      `${childName}'s request for ${dateLabel} until ${timeLabel} was approved by ${ME.name}${note ? ` — ${note}` : ""}`,
    ),
    publishEvent("curfew.exception_approved", reqId, {
      member_id:   req.member_id,
      member_name: childName,
      date:        req.date,
      approved_by: ME.name,
    }),
  ]).catch(() => {});
}

async function denyRequest(reqId, note) {
  const req = requests.find(r => r.id === reqId);
  if (!req || req.status !== "pending") return;
  const now = new Date().toISOString();
  const { changed } = await db(`
    UPDATE app_curfew_manager__exception_requests
    SET status = 'denied', reviewed_by = ?, reviewed_at = ?, review_note = ?
    WHERE id = ?
  `, [ME.id, now, note ?? "", reqId]);
  if (changed === 0) throw await unchangedRequest(reqId, decisionWords("deny"));

  const idx = requests.findIndex(r => r.id === reqId);
  if (idx !== -1) requests[idx] = { ...requests[idx], status: "denied", reviewed_by: ME.id, reviewed_at: now, review_note: note ?? "" };
  closeModal();
  render();

  const dateLabel = formatDate(req.date);
  const childName = memberName(req.member_id);
  Promise.all([
    notify(
      `❌ Curfew exception denied`,
      `${childName}'s request for ${dateLabel} was denied by ${ME.name}${note ? ` — ${note}` : ""}`,
    ),
    publishEvent("curfew.exception_denied", reqId, {
      member_id:   req.member_id,
      member_name: childName,
      date:        req.date,
      denied_by:   ME.name,
    }),
  ]).catch(() => {});
}

// ─── Modal ─────────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }
// A refused or failed save is reported inside the dialog that asked for it,
// worded by failureLine; the hub's error is logged, never shown.
function failText(e, words) { if (!e?.forUser) console.error(e); return failureLine(e, words); }
function modalError(message) {
  const box = modalEl?.querySelector(".modal");
  if (!box) return;
  box.querySelector(".app-error")?.remove();
  const note = document.createElement("div");
  note.className = "app-error";
  note.setAttribute("role", "alert");
  note.textContent = message || "Something went wrong. Please try again.";
  box.appendChild(note);
}

function updateCurfewHint() {
  const dateVal = document.getElementById("f-date")?.value;
  const timeVal = document.getElementById("f-time")?.value;
  const hint    = document.getElementById("f-curfew-hint");
  if (!hint) return;
  if (dateVal && ME) {
    const normal = getCurfewForDate(curfews, ME.id, dateVal);
    if (normal) {
      const timeStr = formatTime(normal);
      const over    = timeVal && exceedsCurfew(normal, timeVal);
      hint.style.display = "block";
      hint.textContent = over
        ? `Your curfew for ${getDayType(dateVal) === "weekend" ? "weekends" : "weekdays"} is ${timeStr}. Your request extends past curfew.`
        : `Your curfew for ${getDayType(dateVal) === "weekend" ? "weekends" : "weekdays"} is ${timeStr}.`;
    } else {
      hint.style.display = "none";
    }
  } else {
    hint.style.display = "none";
  }
}

  if (activeTab === "requests") {
    const matched  = searchQ ? requests.filter(r => searchMatch(searchQ, searchableFields(r))) : requests;

    const resolved = matched.filter(r => r.status !== "pending");

    const searchRow = requests.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search requests…" aria-label="Search requests" value="${esc(searchQ)}" /></div>` : "";

        ? `<div class="empty" style="padding:24px 0">No requests match "${esc(searchQ)}".</div>`

      ? `<hr class="divider">
         <div class="section-title">Resolved</div>
         ${resolved.map(r => renderRequestCard(r)).join("")}`

    el.innerHTML = searchRow + pendingHtml + resolvedHtml;

            : `<div class="none">Not set</div>`}
        </div>
        <div class="curfew-slot">
          <div class="day">Weekends</div>
          ${weekend
            ? `<div class="time">${esc(formatTime(weekend))}</div>`
            : `<div class="none">Not set</div>`}
        </div>
      </div>
    </div>

    ${pending.length > 0 ? `
      <div class="section-title">Pending</div>
      ${pending.map(r => renderRequestCard(r)).join("")}
      <hr class="divider">
    ` : ""}

    <div class="section-title">All Requests</div>
    ${requestsHtml}
  `;
}

window.setTab = function(tab) { activeTab = tab; render(); };
window.editCurfew = function(memberId) { openEditCurfewModal(memberId); };
window.openExceptionRequestModal = openExceptionRequestModal;
window.openDetail_ = function(id) {
  const req = requests.find(r => r.id === id);
  if (req) openDetailModal(req);
};

// ─── Deep link ─────────────────────────────────────────────────────────────────
function handleDeepLink() {
  const requestId = new URLSearchParams(window.location.search).get("requestId");
  if (!requestId) return;
  const req = requests.find(r => r.id === requestId);
  if (req) openDetailModal(req);
}

// ─── Init ──────────────────────────────────────────────────────────────────────
async function firstLoad() {
  let failed = false;
  const fail = () => { failed = true; };
  await Promise.all([loadMembers().catch(fail), loadCurfews().catch(fail), loadRequests().catch(fail)]);
  loadFailed = failed;
  render();
  if (!loadFailed) handleDeepLink();
}
document.addEventListener("click", (e) => {
  if (e.target.closest('[data-testid="load-retry"]')) firstLoad();
});
firstLoad();
</script>
</body>
</html>
